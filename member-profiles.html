<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GORA · Member Profiles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#123653;--blue:#1769aa;--teal:#078b83;--bg:#f3f6fa;--line:#dce5ee;--muted:#64768a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#243447}header{background:var(--navy);color:white;padding:18px}header h1{margin:0;font-size:21px}header p{margin:6px 0 0;color:#d2e0ec;font-size:13px}main{max-width:1100px;margin:20px auto;padding:0 13px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:160px}input,select{width:100%;padding:11px;border:1px solid #cbd6e1;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;background:var(--blue);color:white;padding:11px 14px;font-weight:bold;cursor:pointer}.btn.secondary{background:#e9eff6;color:var(--navy)}.muted{color:var(--muted);font-size:13px}.msg{padding:12px;border-radius:8px;background:#eaf2fb;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.metric{background:#f2f6fa;border-radius:9px;padding:12px}.metric b{display:block;color:var(--navy);font-size:18px;margin-top:4px}.profile{display:grid;grid-template-columns:80px 1fr;gap:13px;align-items:center}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#e8eef5;display:grid;place-items:center;color:var(--navy);font-size:25px;font-weight:bold}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#eaf0f6;font-size:11px;font-weight:bold}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#e8eef5;color:var(--navy)}.tabs button.active{background:var(--navy);color:white}.pane{display:none}.pane.active{display:block}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f4f7fa}.listitem{padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0}.hidden{display:none!important}@media(max-width:550px){.profile{grid-template-columns:60px 1fr}.avatar{width:58px;height:58px}.card{padding:13px}}
</style></head><body>
<header><h1>GORA · Member Profiles</h1><p>Member directory and financial history</p></header><main>
<div class="card"><div id="message" class="msg">Connecting to GORA…</div><div class="row"><input id="search" placeholder="Search name, member number or phone"><button class="btn secondary" id="refresh">Refresh</button></div></div>
<section class="card"><h2>Members</h2><div id="members"><p class="muted">Loading…</p></div></section>
<section class="card hidden" id="profile"><div class="row"><div id="profileHeader"></div><button class="btn secondary" id="close">Close profile</button></div>
<div class="grid" id="metrics"></div><div class="tabs"><button class="btn active" data-tab="personal">Personal</button><button class="btn" data-tab="loans">Loans</button><button class="btn" data-tab="savings">Savings</button><button class="btn" data-tab="chama">Chama</button></div>
<div class="pane active" id="pane-personal"></div><div class="pane" id="pane-loans"></div><div class="pane" id="pane-savings"></div><div class="pane" id="pane-chama"></div></section>
</main><script>
(()=>{const $=id=>document.getElementById(id);let db,orgId,all=[],chosen=null;const esc=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"KSh "+Number(n||0).toLocaleString("en-KE",{minimumFractionDigits:2,maximumFractionDigits:2});const date=v=>v?new Date(v).toLocaleDateString("en-KE"):"—";function message(t){$("message").textContent=t}
async function init(){try{const url=localStorage.getItem("gora_url"),key=localStorage.getItem("gora_key");if(!url||!key)throw Error("GORA connection settings missing. Sign in through the main GORA workspace first.");db=window.supabase.createClient(url,key);const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session)throw Error("Please sign in through the main GORA workspace.");const {data:roles,error:re}=await db.from("user_roles").select("organization_id").eq("user_id",session.user.id).eq("is_active",true);if(re)throw re;const ids=[...new Set((roles||[]).map(x=>x.organization_id).filter(Boolean))];if(!ids.length)throw Error("No active organization assigned.");orgId=ids[0];await load()}catch(e){message(e.message)}}
async function load(){message("Loading member directory…");const {data,error}=await db.from("members").select("id,member_number,full_name,phone,status,gender,date_of_birth,national_id,county,town,estate,address,occupation,income_source,next_of_kin_name,next_of_kin_relationship,next_of_kin_phone,branch_id,chama_group_id,created_at,member_photo_path").eq("organization_id",orgId).order("full_name").limit(1000);if(error)throw error;all=data||[];render();message("Loaded "+all.length+" member records.")}
function render(){const q=$("search").value.toLowerCase().trim(),rows=all.filter(m=>[m.full_name,m.member_number,m.phone,m.status].some(v=>String(v||"").toLowerCase().includes(q)));$("members").innerHTML=rows.length?rows.map(m=>`<div class="listitem row"><div><strong>${esc(m.full_name)}</strong><div class="muted">${esc(m.member_number||"Number pending")} · ${esc(m.phone||"")} · ${esc(m.status)}</div></div><button class="btn" data-id="${m.id}">Open profile</button></div>`).join(""):'<p class="muted">No matching members.</p>';$("members").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id))}
async function safeQuery(table,select,filters,order){let q=db.from(table).select(select);for(const [k,v] of Object.entries(filters||{}))q=q.eq(k,v);if(order)q=q.order(order,{ascending:false});const {data,error}=await q.limit(300);if(error)return {data:[],error:error.message};return {data:data||[],error:null}}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${headers.length}">No records found.</td></tr>`}</tbody></table></div>`}
async function open(id){chosen=all.find(m=>m.id===id);if(!chosen)return;$("profile").classList.remove("hidden");$("profileHeader").innerHTML=`<div class="profile"><div class="avatar">${esc((chosen.full_name||"M").slice(0,1).toUpperCase())}</div><div><h2>${esc(chosen.full_name)}</h2><p class="muted">${esc(chosen.member_number||"Member number pending")} · ${esc(chosen.phone)} · <span class="pill">${esc(chosen.status)}</span></p></div></div>`;$("metrics").innerHTML=[["Status",chosen.status],["Member since",date(chosen.created_at)],["Member number",chosen.member_number||"Pending"]].map(x=>`<div class="metric"><span class="muted">${esc(x[0])}</span><b>${esc(x[1]||"—")}</b></div>`).join("");$("pane-personal").innerHTML=`<h3>Personal information</h3>${table(["Field","Details"],[["Full name",chosen.full_name],["Phone",chosen.phone],["National ID",chosen.national_id],["Gender",chosen.gender],["Date of birth",date(chosen.date_of_birth)],["County",chosen.county],["Town",chosen.town],["Estate / village",chosen.estate],["Address",chosen.address],["Occupation",chosen.occupation],["Income source",chosen.income_source],["Next of kin",chosen.next_of_kin_name],["Relationship",chosen.next_of_kin_relationship],["Next of kin phone",chosen.next_of_kin_phone]])}`;
const [la,sa,st,cm]=await Promise.all([safeQuery("loan_accounts","id,loan_account_number,principal_amount,total_repayment,status,disbursed_on,first_due_date",{organization_id:orgId,member_id:id},"created_at"),safeQuery("savings_accounts","id,account_number,balance,status,created_at",{organization_id:orgId,member_id:id},"created_at"),safeQuery("savings_transactions","transaction_date,transaction_type,amount,reference_number,description,status",{organization_id:orgId,member_id:id},"transaction_date"),safeQuery("chama_memberships","group_id,status,joined_at,chama_groups(group_name,group_code)",{organization_id:orgId,member_id:id},"joined_at")]);
$("pane-loans").innerHTML="<h3>Loan accounts</h3>"+(la.error?`<p class="muted">${esc(la.error)}</p>`:table(["Account","Principal","Total repayment","Status","Disbursed","First due"],la.data.map(x=>[x.loan_account_number,money(x.principal_amount),money(x.total_repayment),x.status,date(x.disbursed_on),date(x.first_due_date)])));
$("pane-savings").innerHTML="<h3>Savings accounts</h3>"+(sa.error?`<p class="muted">${esc(sa.error)}</p>`:table(["Account","Balance","Status","Opened"],sa.data.map(x=>[x.account_number,money(x.balance),x.status,date(x.created_at)])))+"<h3>Transactions</h3>"+(st.error?`<p class="muted">${esc(st.error)}</p>`:table(["Date","Type","Amount","Reference","Description","Status"],st.data.map(x=>[date(x.transaction_date),x.transaction_type,money(x.amount),x.reference_number,x.description,x.status])));
$("pane-chama").innerHTML="<h3>Chama memberships</h3>"+(cm.error?`<p class="muted">${esc(cm.error)}</p>`:table(["Group","Code","Membership","Joined"],cm.data.map(x=>[x.chama_groups?.group_name,x.chama_groups?.group_code,x.status,date(x.joined_at)])));
$("profile").scrollIntoView({behavior:"smooth"});}
$("search").oninput=render;$("refresh").onclick=()=>load().catch(e=>message(e.message));$("close").onclick=()=>$("profile").classList.add("hidden");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["personal","loans","savings","chama"].forEach(t=>$("pane-"+t).classList.toggle("active",t===b.dataset.tab))});init();
})();
</script></body></html>
