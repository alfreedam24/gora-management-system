<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GORA · Member Profiles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--n:#123653;--b:#1769aa;--bg:#f3f6fa;--line:#dce5ee;--m:#64768a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:#243447}header{background:var(--n);color:white;padding:18px}main{max-width:1100px;margin:20px auto;padding:0 13px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:150px}input{width:100%;padding:11px;border:1px solid #cbd6e1;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;background:var(--b);color:white;padding:11px;font-weight:bold}.secondary{background:#e9eff6;color:var(--n)}.muted{color:var(--m);font-size:13px}.msg{padding:12px;background:#eaf2fb;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.metric{background:#f2f6fa;padding:12px;border-radius:9px}.metric b{display:block;font-size:18px;margin-top:4px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#e8eef5;color:var(--n)}.tabs .active{background:var(--n);color:white}.pane{display:none}.pane.active{display:block}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{background:#f4f7fa}.item{padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0}.hidden{display:none!important}
</style></head><body><header><h2>GORA · Member Profiles</h2><p>Member directory and financial history</p></header><main>
<div class="card"><div id="message" class="msg">Connecting…</div><div class="row"><input id="search" placeholder="Search name, member number or phone"><button class="btn secondary" id="refresh">Refresh</button></div></div>
<section class="card"><h2>Members</h2><div id="members">Loading…</div></section>
<section class="card hidden" id="profile"><div class="row"><div id="head"></div><button class="btn secondary" id="close">Close profile</button></div><div class="grid" id="metrics"></div>
<div class="tabs"><button class="btn active" data-tab="personal">Personal</button><button class="btn" data-tab="loans">Loans</button><button class="btn" data-tab="savings">Savings</button><button class="btn" data-tab="chama">Chama</button></div>
<div id="pane-personal" class="pane active"></div><div id="pane-loans" class="pane"></div><div id="pane-savings" class="pane"></div><div id="pane-chama" class="pane"></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);let db,org,all=[];const esc=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>"KSh "+Number(n||0).toLocaleString("en-KE",{minimumFractionDigits:2,maximumFractionDigits:2}),dt=v=>v?new Date(v).toLocaleDateString("en-KE"):"—";function msg(t){$("message").textContent=t}
async function init(){try{let url=localStorage.getItem("gora_url"),key=localStorage.getItem("gora_key");if(!url||!key)throw Error("Sign in through the main GORA workspace first.");db=supabase.createClient(url,key);let {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session)throw Error("Please sign in through the main GORA workspace.");let r=await db.from("user_roles").select("organization_id").eq("user_id",session.user.id).eq("is_active",true);if(r.error)throw r.error;org=(r.data||[])[0]?.organization_id;if(!org)throw Error("No active organization assigned.");await load()}catch(e){msg(e.message)}}
async function load(){msg("Loading members…");let r=await db.from("members").select("id,member_number,full_name,phone,status,gender,date_of_birth,national_id,county,town,estate,address,occupation,income_source,next_of_kin_name,next_of_kin_relationship,next_of_kin_phone,created_at").eq("organization_id",org).order("full_name").limit(1000);if(r.error)throw r.error;all=r.data||[];render();msg("Loaded "+all.length+" member records.")}
function render(){let q=$("search").value.toLowerCase().trim(),rows=all.filter(m=>[m.full_name,m.member_number,m.phone,m.status].some(v=>String(v||"").toLowerCase().includes(q)));$("members").innerHTML=rows.length?rows.map(m=>`<div class="item row"><div><b>${esc(m.full_name)}</b><div class="muted">${esc(m.member_number||"Number pending")} · ${esc(m.phone)} · ${esc(m.status)}</div></div><button class="btn" data-id="${m.id}">Open profile</button></div>`).join(""):"<p class='muted'>No matching members.</p>";$("members").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id))}
async function query(table,cols,filters,order){let q=db.from(table).select(cols);Object.entries(filters).forEach(([k,v])=>q=q.eq(k,v));if(order)q=q.order(order,{ascending:false});let r=await q.limit(300);return {data:r.data||[],error:r.error?.message}}
function tbl(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${h.length}">No records found.</td></tr>`}</tbody></table></div>`}
async function open(id){let m=all.find(x=>x.id===id);if(!m)return;$("profile").classList.remove("hidden");$("head").innerHTML=`<h2>${esc(m.full_name)}</h2><p class="muted">${esc(m.member_number)} · ${esc(m.phone)} · ${esc(m.status)}</p>`;$("metrics").innerHTML=[["Status",m.status],["Member since",dt(m.created_at)],["Member number",m.member_number||"Pending"]].map(x=>`<div class="metric"><span class="muted">${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join("");$("pane-personal").innerHTML="<h3>Personal information</h3>"+tbl(["Field","Details"],[["Full name",m.full_name],["Phone",m.phone],["National ID",m.national_id],["Gender",m.gender],["DOB",dt(m.date_of_birth)],["County",m.county],["Town",m.town],["Estate",m.estate],["Address",m.address],["Occupation",m.occupation],["Income source",m.income_source],["Next of kin",m.next_of_kin_name],["Relationship",m.next_of_kin_relationship],["Next of kin phone",m.next_of_kin_phone]]);
let [lo,sa,ch]=await Promise.all([query("loan_accounts","id,loan_account_number,principal_amount,total_repayment,status,disbursed_on,first_due_date",{organization_id:org,member_id:id},"created_at"),query("savings_accounts","id,account_number,status,opened_at,created_at",{organization_id:org,member_id:id},"created_at"),query("chama_memberships","group_id,status,joined_at,chama_groups(group_name,group_code)",{organization_id:org,member_id:id},"joined_at")]);
let tx={data:[],error:null};if(!sa.error&&sa.data.length){let t=await db.from("savings_transactions").select("transaction_date,transaction_type,amount,reference_number,description,status,savings_account_id").eq("organization_id",org).in("savings_account_id",sa.data.map(a=>a.id)).order("transaction_date",{ascending:false}).limit(300);tx={data:t.data||[],error:t.error?.message}}
$("pane-loans").innerHTML="<h3>Loan accounts</h3>"+(lo.error?esc(lo.error):tbl(["Account","Principal","Total repayment","Status","Disbursed","First due"],lo.data.map(x=>[x.loan_account_number,money(x.principal_amount),money(x.total_repayment),x.status,dt(x.disbursed_on),dt(x.first_due_date)])));
$("pane-savings").innerHTML="<h3>Savings accounts</h3>"+(sa.error?esc(sa.error):tbl(["Account","Status","Opened"],sa.data.map(x=>[x.account_number,x.status,dt(x.opened_at||x.created_at)])))+"<h3>Transactions</h3>"+(tx.error?esc(tx.error):tbl(["Date","Type","Amount","Reference","Description","Status"],tx.data.map(x=>[dt(x.transaction_date),x.transaction_type,money(x.amount),x.reference_number,x.description,x.status])));
$("pane-chama").innerHTML="<h3>Chama memberships</h3>"+(ch.error?esc(ch.error):tbl(["Group","Code","Membership","Joined"],ch.data.map(x=>[x.chama_groups?.group_name,x.chama_groups?.group_code,x.status,dt(x.joined_at)])));$("profile").scrollIntoView({behavior:"smooth"})}
$("search").oninput=render;$("refresh").onclick=()=>load().catch(e=>msg(e.message));$("close").onclick=()=>$("profile").classList.add("hidden");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["personal","loans","savings","chama"].forEach(t=>$("pane-"+t).classList.toggle("active",t===b.dataset.tab))});init()})();
</script></body></html>
